<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover でノッチの外まで背景を広げる。
         user-scalable=no は現場での誤操作（ピンチで画面が動く）を防ぐ。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="color-scheme" content="light" />
    <!-- ホーム画面に追加したときフルスクリーンで開く -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Slate" />
    <!-- 電波の無い現場でも起動できるよう、ホーム画面のアプリとして入れる -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />

    <script type="module" crossorigin src="./assets/index-BAubaO1q.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Cu_A0WE9.css">
  </head>

</html>
